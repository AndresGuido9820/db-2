services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-plsql
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123}
      APP_USER: ${APP_USER:-dev}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-Dev123}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle_data:
