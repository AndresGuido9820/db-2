services:
  oracle23ai:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-vectors
    ports:
      - "1522:1521"
      - "5501:5500"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123}
      APP_USER: ${APP_USER:-vec}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-Vec123}
    volumes:
      - oracle_vectors_data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

volumes:
  oracle_vectors_data:
